; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp>

monitor_speed = 115200
upload_speed = 921600

; ---------------------------------------------------------------------------
; ピン割り当て / pin map
;   実体は include/pins.h。ここでは TFT_eSPI をビルドフラグで設定する
;   (User_Setup.h を触らずに済むように USER_SETUP_LOADED を定義する)。
;   I2C : SDA=GPIO21, SCL=GPIO22 (BME680 / MPU-9250)
;   SPI : 液晶の実配線に合わせる
;         ST7789  SCK=GPIO18, MOSI=GPIO23, CS=GPIO15, DC=GPIO19, RST=GPIO17
;         USR-ES1(W5500) は SCLK/MOSI を共有。MISO=13, CS=16, RST=4 は config.h
;         TFT_MISO は液晶では未使用だが -1 にしてはいけない:
;         TFT_eSPI は自前の SPIClass(VSPI) で spi.begin(SCLK, MISO, MOSI, -1) を
;         呼び、-1 だと ESP32 HAL が VSPI 既定の GPIO19 (= 液晶 DC) に MISO を
;         接続してしまい、共有バスの MISO=GPIO13 が上書きされて W5500 が読めない。
;         そのため W5500 と同じ GPIO13 を明示する。
;   ST7789 (2.8 inch) : 240x320
;   (縦 240x320 ネイティブパネル。CGRAM オフセットは不要)
; ---------------------------------------------------------------------------
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=13
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=19
  -DTFT_RST=17
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  ; ブレッドボード配線の切り分けのため低めに設定。配線が安定したら
  ; 20000000〜40000000 まで上げてよい (表示が速くなる)。
  -DSPI_FREQUENCY=10000000
  -DSPI_READ_FREQUENCY=8000000

lib_deps =
  bodmer/TFT_eSPI
  adafruit/Adafruit BME680 Library
  hideakitai/MPU9250
  khoih-prog/Ethernet_Generic

; ---------------------------------------------------------------------------
; 表示だけの切り分けテスト (配線/バックライト/初期化の確認用)
;   pio run -e tft_test -t upload
;   pio device monitor
; 画面が赤→緑→青→白→黒と 0.8 秒毎に切り替われば液晶と配線は OK。
; 切り替わらなければピン/バックライト/SPI 配線を疑う。
; ---------------------------------------------------------------------------
[env:tft_test]
extends = env:esp32dev
build_src_filter = +<tft_test.cpp>
