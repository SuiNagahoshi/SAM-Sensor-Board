; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ---------------------------------------------------------------------------
; ピン割り当て / pin map
;   実体は include/pins.h。ここでは TFT_eSPI をビルドフラグで設定する
;   (User_Setup.h を触らずに済むように USER_SETUP_LOADED を定義する)。
;   I2C : SDA=GPIO21, SCL=GPIO22 (BME680 / MPU-9250)
;   SPI : 共有バス SCK=GPIO14, MISO=GPIO12, MOSI=GPIO13
;         ST7789 CS=GPIO15, USR-ES1(W5500) CS=GPIO18
;   ST7789 : DC=GPIO2, RST=GPIO4, 240x240
; ---------------------------------------------------------------------------
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000

lib_deps =
  bodmer/TFT_eSPI
  adafruit/Adafruit BME680 Library
  bolderflight/Bolder Flight Systems MPU9250
  khoih-prog/Ethernet_Generic
